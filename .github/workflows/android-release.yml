name: Build and publish Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, including the v prefix
        required: true
        default: v0.5.1
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, sign, and publish
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Validate release configuration
        run: |
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release version must use the vMAJOR.MINOR.PATCH format" >&2
            exit 1
          }
          test -s signing/personal-ai-os-release.keystore || { echo "Release keystore is missing" >&2; exit 1; }
          test -s signing/password.txt || { echo "Release signing password is missing" >&2; exit 1; }

      - name: Test and assemble signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/signing/personal-ai-os-release.keystore
          ANDROID_KEYSTORE_PASSWORD_FILE: ${{ github.workspace }}/signing/password.txt
          ANDROID_KEY_PASSWORD_FILE: ${{ github.workspace }}/signing/password.txt
          ANDROID_KEY_ALIAS: personal-ai-os
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Verify and package APK
        run: |
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          APK_NAME="Personal-AI-OS-${RELEASE_VERSION}.apk"
          APK_DESTINATION="dist/$APK_NAME"
          test -f "$APK_SOURCE" || { echo "Signed release APK was not generated" >&2; exit 1; }
          mkdir -p dist
          cp "$APK_SOURCE" "$APK_DESTINATION"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER" || { echo "apksigner was not found" >&2; exit 1; }
          "$APKSIGNER" verify --verbose "$APK_DESTINATION"
          cd dist
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="dist/Personal-AI-OS-${RELEASE_VERSION}.apk"
          CHECKSUM="$APK.sha256"
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION" "$APK" "$CHECKSUM" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_VERSION" "$APK" "$CHECKSUM" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Personal AI OS ${RELEASE_VERSION}" \
              --generate-notes \
              --latest
          fi
